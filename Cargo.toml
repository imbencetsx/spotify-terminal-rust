[package]
name = "str"
version = "0.1.0"
description = "A tiny vim-flavoured Spotify terminal player, powered by Spotify Soloist"
edition = "2024"

[dependencies]
anyhow = "1"
base64 = "0.23.1"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = "0.3"
getrandom = "0.4.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "json", "form", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "process", "signal"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "handshake"] }
toml = "1"
unicode-width = "0.2.3"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
